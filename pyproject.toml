[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "drivegrab"
dynamic = ["version"]
description = "Download view-only PDFs and entire folders from Google Drive, keeping the folder structure."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Magamedkhan Osmanov" }]
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40",
    "img2pdf>=0.5",
]
keywords = ["google-drive", "view-only", "pdf", "downloader", "playwright", "scraper"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/Osmanov2006/drivegrab"
Issues = "https://github.com/Osmanov2006/drivegrab/issues"

[project.scripts]
drivegrab = "drivegrab.cli:main"

[tool.setuptools.dynamic]
version = { attr = "drivegrab.__version__" }

[tool.setuptools.packages.find]
include = ["drivegrab*"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
